name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java Version
        run: java -version

      - name: Verify Maven
        run: ./mvnw --version

      - name: Compile, test and generate coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Scan source and dependencies with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          ignore-unfixed: true
          severity: CRITICAL 
          exit-code: '1'

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: java-pipeline-demo
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
